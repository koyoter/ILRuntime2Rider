name: CI

on:
  push:
    # Main 分支提交不触发构建；发布仅由 tag 驱动
    branches-ignore: ['main']
    tags: ['v*']
  pull_request:

jobs:
  Build:
    # Smoke build on branch pushes / PRs; release artifacts come from the Release matrix below.
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            build/gradle-jvm
            C:\Users\runneradmin\AppData\Local\gradle-jvm
            ~/.nuget/packages
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-Build-${{ hashFiles('gradlew.bat', 'src/dotnet/*/*.csproj', 'src/dotnet/*.props', 'gradle-wrapper.properties') }}
      - name: Cache Rider IDE zip
        uses: actions/cache@v4
        with:
          path: rider-ide/JetBrains.Rider-2024.3.8.win.zip
          key: rider-ide-zip-2024.3.8
      - name: Download Rider IDE
        shell: pwsh
        # Gradle must resolve the IntelliJ Platform dependency during configuration;
        # downloading the ~3 GB IDE there is fragile on CI. Download it up front
        # (resumable curl with retries) and point Gradle at the extracted instance
        # via -PLocalRiderHome. Keep the version in sync with ProductVersion in gradle.properties.
        run: |
          $ver = "2024.3.8"
          $root = "rider-ide/$ver"
          $zip = "rider-ide/JetBrains.Rider-$ver.win.zip"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if (-not (Test-Path $zip)) {
            curl.exe -fL --retry 5 --retry-delay 10 -o $zip "https://download.jetbrains.com/rider/JetBrains.Rider-$ver.win.zip"
          }
          tar -xf $zip -C $root
          if (-not (Test-Path "$root/product-info.json")) {
            $inner = Get-ChildItem $root -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'product-info.json') } | Select-Object -First 1
            if (-not $inner) { throw "product-info.json not found after extracting Rider $ver" }
            Get-ChildItem $inner.FullName | Move-Item -Destination $root -Force
          }
      # Quote every -P arg: when pwsh invokes gradlew.bat it splits an unquoted value at
      # the first '.' (-PFoo=2024.3.8 arrives as "-PFoo=2024" ".3.8"), which Gradle then
      # mistakes for a task name.
      - run: ./gradlew :buildPlugin --no-daemon "-PLocalRiderHome=${{ github.workspace }}/rider-ide/2024.3.8"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}.CI.${{ github.ref_name }}
          path: output

  Test:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            build/gradle-jvm
            packages
            ~/.nuget/packages
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-Test-${{ hashFiles('gradlew.bat', 'src/dotnet/*/*.csproj', 'src/dotnet/*.props', 'gradle-wrapper.properties') }}
      - run: ./gradlew :testDotNet --no-daemon

  Release:
    # One tag -> one plugin zip per supported Rider line.
    # -PProductVersion selects the IDE used to compile and run rdgen; the dotnet backend
    # compiles against -PDotnetSdkVersion (exact patch: WaveVersion is derived from it).
    # Since/until are pinned per entry so each zip targets exactly its own Rider line.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rider:
          - { product: '2024.3.8', sdk: '2024.3.8', since: '243', until: '243.*' }
          - { product: '2025.1',   sdk: '2025.1.0', since: '251', until: '251.*' }
          - { product: '2025.2',   sdk: '2025.2.0', since: '252', until: '252.*' }
          - { product: '2025.3',   sdk: '2025.3.0', since: '253', until: '253.*' }
          - { product: '2026.1',   sdk: '2026.1.0', since: '261', until: '261.*' }
          - { product: '2026.2',   sdk: '2026.2.0', since: '262', until: '262.*' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: |
            build/gradle-jvm
            C:\Users\runneradmin\AppData\Local\gradle-jvm
            ~/.nuget/packages
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-Release-${{ matrix.rider.product }}-${{ hashFiles('gradlew.bat', 'src/dotnet/*/*.csproj', 'src/dotnet/*.props', 'gradle-wrapper.properties') }}
      - name: Download Rider IDE
        shell: pwsh
        # See the same step in the Build job: pre-provision the IDE so Gradle
        # never has to download the ~3 GB platform during configuration.
        # 6 x ~3 GB per tag exceeds the shared GitHub Actions cache budget, so
        # release jobs download fresh each time; tags are rare.
        run: |
          $ver = "${{ matrix.rider.product }}"
          $root = "rider-ide/$ver"
          $zip = "rider-ide/JetBrains.Rider-$ver.win.zip"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          curl.exe -fL --retry 5 --retry-delay 10 -o $zip "https://download.jetbrains.com/rider/JetBrains.Rider-$ver.win.zip"
          tar -xf $zip -C $root
          if (-not (Test-Path "$root/product-info.json")) {
            $inner = Get-ChildItem $root -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'product-info.json') } | Select-Object -First 1
            if (-not $inner) { throw "product-info.json not found after extracting Rider $ver" }
            Get-ChildItem $inner.FullName | Move-Item -Destination $root -Force
          }
      - name: Derive plugin version from tag
        # Tag is the single source of truth (e.g. v0.1.0 -> 0.1.0); overrides gradle.properties.
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "PLUGIN_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build plugin
        # Same pwsh/gradlew.bat '.'-splitting hazard as in the Build job; quote every -P arg.
        run: ./gradlew :buildPlugin --no-daemon "-PPluginVersion=${{ env.PLUGIN_VERSION }}" "-PLocalRiderHome=${{ github.workspace }}/rider-ide/${{ matrix.rider.product }}" "-PProductVersion=${{ matrix.rider.product }}" "-PDotnetSdkVersion=${{ matrix.rider.sdk }}" "-PRiderSinceBuild=${{ matrix.rider.since }}" "-PRiderUntilBuild=${{ matrix.rider.until }}"
      - name: Rename artifacts with Rider version
        # All matrix entries produce identical file names; suffix them so
        # artifact merge + release upload don't overwrite each other.
        shell: pwsh
        run: |
          Get-ChildItem output -File | ForEach-Object {
            if ($_.Name -match '\.zip$') {
              Rename-Item $_.FullName -NewName ($_.Name -replace '\.zip$', "-${{ matrix.rider.product }}.zip")
            }
            elseif ($_.Name -match '\.nupkg$') {
              Rename-Item $_.FullName -NewName ($_.Name -replace '\.nupkg$', "-${{ matrix.rider.product }}.nupkg")
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.repository.name }}.Release.${{ matrix.rider.product }}
          path: output

  GitHubRelease:
    needs: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ github.event.repository.name }}.Release.*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
