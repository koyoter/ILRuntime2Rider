// Built with the IntelliJ Platform Gradle Plugin 2.x
// Reference: https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.20'
    id 'org.jetbrains.intellij.platform' version '2.5.0'
    id 'com.jetbrains.rdgen' version '2026.2.5'      // See https://github.com/JetBrains/rd/releases
}

ext {
    isWindows = Os.isFamily(Os.FAMILY_WINDOWS)
    rdLibDirectory = {
        new File(intellijPlatform.platformPath.toFile(), "lib/rd")
    }
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

wrapper {
    gradleVersion = '8.10.2'
    distributionType = Wrapper.DistributionType.ALL
    distributionUrl = "https://cache-redirector.jetbrains.com/services.gradle.org/distributions/gradle-${gradleVersion}-all.zip"
}

version = ext.PluginVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

kotlin {
    jvmToolchain(17)
}

tasks.named("processResources") {
    from("dependencies.json", { into "META-INF" })
}

// The product wave (243/251/.../262) gates source-level platform differences that
// Kotlin cannot express with a preprocessor.
def productWave = ProductVersion.substring(2, 4) + ProductVersion.substring(5, 6)

sourceSets {
    main {
        java.srcDir 'src/rider/main/java'
        kotlin {
            srcDir 'src/rider/main/kotlin'
            // 2026.2 removed the createDebuggerWorker hook the pre-262 variant of
            // ILRuntimeAttachProfileState relies on; the two trees carry wave-specific
            // variants of that one class.
            if (productWave >= '262') {
                srcDir 'src/rider/main/kotlin262'
            } else {
                srcDir 'src/rider/main/kotlinPre262'
            }
        }
        resources.srcDir 'src/rider/main/resources'
    }
}

dependencies {
    intellijPlatform {
        def localRiderHome = providers.gradleProperty('LocalRiderHome')
        if (localRiderHome.isPresent()) {
            // Pre-provisioned IDE (CI downloads and extracts it before running Gradle):
            // resolves instantly at configuration time, no network involved.
            local(new File(localRiderHome.get()))
        } else {
            // useInstaller = false: the Rider installer-based flow is not supported
            // by the plugin for Rider targets; use the zip distribution.
            // NOTE: this resolves/downloads the whole IDE (~3 GB) during configuration.
            rider("${ProductVersion}", false)
        }
    }
}

task setBuildTool {
    doLast {
        ext.executable = "dotnet"
        ext.args = ["msbuild"]

        if (isWindows) {
            ByteArrayOutputStream stdout = new ByteArrayOutputStream()
            exec {
                executable "${rootDir}\\tools\\vswhere.exe"
                args '-latest','-property','installationPath','-products','*'
                standardOutput = stdout
                workingDir rootDir
            }

            def directory = stdout.toString().trim()
            if (directory) {
                List<String> files = new FileNameFinder().getFileNames("${directory}\\MSBuild", "**/MSBuild.exe")
                ext.executable = files.get(0)
                ext.args = ["/v:minimal"]
            }
        }

        ext.args << "${DotnetSolution}"
        ext.args << "/p:Configuration=${BuildConfiguration}"
        ext.args << "/p:HostFullIdentifier="
        ext.args << "/p:SdkVersion=${DotnetSdkVersion}"
    }
}

task compileDotNet {
    dependsOn setBuildTool
    doLast {
        def arguments = setBuildTool.args.clone()
        arguments << "/t:Restore;Rebuild"
        exec {
            executable setBuildTool.executable
            args arguments
            workingDir rootDir
        }
    }
}

task testDotNet {
    doLast {
        exec {
            executable "dotnet"
            args "test","${DotnetSolution}","--logger","GitHubActions"
            workingDir rootDir
        }
    }
}

intellijPlatform {
    instrumentCode = false
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = "${RiderSinceBuild}"
            untilBuild = "${RiderUntilBuild}"
        }
        changeNotes = {
            def changelogText = file("${rootDir}/CHANGELOG.md").text
            def changelogMatches = changelogText =~ /(?s)(-.+?)(?=##|$)/
            changelogMatches.collect {
                it[1].replaceAll(/(?s)\r?\n/, "<br />\n")
            }.take(1).join('')
        }()
    }
}

tasks {
    runIde {
        // Match Rider's default heap size of 1.5Gb (default for runIde is 512Mb)
        maxHeapSize = "1500m"
    }
}

// Regenerates the protocol model code (ILRuntimeDebuggerWorkerModel.Generated.kt is
// checked in, so this is a manual tool step — the CI build never runs it).
// rdgen 2026.x no longer compiles the model itself: compile :protocol first and put
// its output plus the IDE's rd jars on the classpath.
def rdLibDir = rdLibDirectory()
def kotlinStdlibJar = buildscript.configurations.classpath.files.find { it.name.startsWith("kotlin-stdlib") }
rdgen {
    def csOutput = new File(rootDir, "src/dotnet/${DotnetPluginId}/Rider")
    def ktOutput = new File(rootDir, "src/rider/main/kotlin/${RiderPluginId.replace('.','/').toLowerCase()}")

    verbose = true
    classpath new File(rootDir, "protocol/build/classes/kotlin/main")
    classpath file("${rdLibDir}/rider-model.jar"), "${rdLibDir}/rd-framework.jar", "${rdLibDir}/rd-core.jar"
    classpath kotlinStdlibJar
    packages = "model.debuggerWorker"

    generator {
        language = "kotlin"
        transform = "asis"
        root = "com.jetbrains.rider.model.nova.debugger.main.DebuggerRoot"
        directory = "$ktOutput/model/debuggerWorker"
    }

    generator {
        language = "csharp"
        transform = "reversed"
        root = "com.jetbrains.rider.model.nova.debugger.main.DebuggerRoot"
        directory = "$csOutput/Model/DebuggerWorker"
    }
}

tasks.named("rdgen") {
    dependsOn ":protocol:compileKotlin"
}

tasks.named("buildPlugin") {
    doLast {
        copy {
            from "${buildDir}/distributions/${rootProject.name}-${version}.zip"
            into "${rootDir}/output"
        }

        def changelogText = file("${rootDir}/CHANGELOG.md").text
        def changelogMatches = changelogText =~ /(?s)(-.+?)(?=##|$)/
        def changeNotes = changelogMatches.collect {
            it[1].replaceAll(/(?s)- /, "\u2022 ").replaceAll(/`/, "").replaceAll(/,/, "%2C").replaceAll(/;/, "%3B").replaceAll(/(?s)\r?\n/, " ")
        }.take(1).join("")

        def arguments = setBuildTool.args.clone()
        arguments << "/t:Pack"
        arguments << "/p:PackageOutputPath=${rootDir}/output"
        arguments << "/p:PackageReleaseNotes=${changeNotes}"
        arguments << "/p:PackageVersion=${version}"
        exec {
            executable setBuildTool.executable
            args arguments
            workingDir rootDir
        }
    }
}

tasks.named("prepareSandbox") {
    dependsOn compileDotNet

    def outputFolder = "${rootDir}/src/dotnet/${DotnetPluginId}/bin/${DotnetPluginId}.Rider/${BuildConfiguration}"
    def dllFiles = [
            "$outputFolder/${DotnetPluginId}.dll",
            "$outputFolder/${DotnetPluginId}.pdb",
            "$outputFolder/ILRuntime.dll",
            "$outputFolder/ILRuntime.pdb",
            "$outputFolder/ILRuntime.Mono.Cecil.dll",
            "$outputFolder/ILRuntime.Mono.Cecil.pdb",
    ]

    dllFiles.forEach({ f ->
        def file = file(f)
        from(file, { into "${rootProject.name}/dotnetDebuggerWorker" })
    })

    doLast {
        dllFiles.forEach({ f ->
            def file = file(f)
            if (!file.exists()) throw new RuntimeException("File ${file} does not exist")
        })
    }
}

tasks.named("publishPlugin") {
    dependsOn testDotNet
    dependsOn buildPlugin
    token = "${PublishToken}"

    doLast {
        exec {
            executable "dotnet"
            args "nuget","push","output/${DotnetPluginId}.${version}.nupkg","--api-key","${PublishToken}","--source","https://plugins.jetbrains.com"
            workingDir rootDir
        }
    }
}
