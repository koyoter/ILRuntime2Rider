# Any property can be overwritten from command-line via
#   -P<propertyName>=<value>

DotnetPluginId=ReSharperPlugin.ILRuntime2Rider
DotnetSolution=ReSharperPlugin.ILRuntime2Rider.sln
RiderPluginId=com.jetbrains.rider.plugins.ilruntime2rider
PluginVersion=0.1.0

BuildConfiguration=Debug

PublishToken="_PLACEHOLDER_"

# See https://www.jetbrains.com/intellij-repository/snapshots
# Keep in sync with SdkVersion in Plugin.props -->
#
# Examples:
#   Release:  2020.2
#   EAP:      2020.3-EAP2-SNAPSHOT
#   Nightly:  2020.3-SNAPSHOT
ProductVersion=2024.3.8

# ReSharper/Rider SDK NuGet version used by the dotnet backend.
# Local default; CI release matrix overrides it per Rider version via -PDotnetSdkVersion
# (passed to MSBuild as the global property /p:SdkVersion, which wins over Plugin.props).
# Must be an exact patch version (Directory.Build.props slices it to derive WaveVersion).
DotnetSdkVersion=2024.3.8

# Keep in sync with idea-version in plugin.xml
RiderSinceBuild=243
RiderUntilBuild=243.*

# Kotlin 1.4 will bundle the stdlib dependency by default, causing problems with the version bundled with the IDE
# https://blog.jetbrains.com/kotlin/2020/07/kotlin-1-4-rc-released/#stdlib-default
kotlin.stdlib.default.dependency=false
